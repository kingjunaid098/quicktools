<body>

<div class="top"></div>

<div class="container">

  <div class="header">
    <div class="logo">⚙</div>
    <h1>quicktools</h1>
    <span class="badge">Directory</span>
  </div>

  <div class="path">
    📁 /quicktools
  </div>

  <div class="directory">

    <div class="directory-header">
      <span>Repository files</span>
      <span id="count" class="count"></span>
    </div>

    <div id="files" class="status">
      Loading files...
    </div>

  </div>

  <footer>
    Automatically updated from GitHub
  </footer>

</div>

<script>
  const OWNER = "kingjunaid098";
  const REPO = "quicktools";
  const BRANCH = "main";

  const filesContainer = document.getElementById("files");
  const countElement = document.getElementById("count");

  async function loadDirectory() {

    const apiURL =
      `https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`;

    try {

      const response = await fetch(apiURL, {
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error(`GitHub API error: ${response.status}`);
      }

      const data = await response.json();

      if (!data.tree) {
        throw new Error("No files returned by GitHub.");
      }

      /*
       * Only files.
       * Ignore GitHub's own metadata.
       */

      const files = data.tree
        .filter(item => item.type === "blob")
        .filter(item => item.path !== "index.html")
        .filter(item => item.path !== "robots.txt")
        .sort((a, b) =>
          a.path.localeCompare(b.path)
        );

      filesContainer.innerHTML = "";

      countElement.textContent =
        `${files.length} file${files.length === 1 ? "" : "s"}`;

      if (files.length === 0) {
        filesContainer.innerHTML =
          `<div class="status">No files found.</div>`;
        return;
      }

      files.forEach(file => {

        const link = document.createElement("a");

        link.className = "file";

        /*
         * GitHub Pages URL.
         *
         * Example:
         * growwexporter
         *
         * becomes:
         * ./growwexporter
         */

        link.href = `./${file.path}`;

        /*
         * Open normal web files directly.
         */

        const extension =
          file.path.includes(".")
            ? file.path.split(".").pop().toLowerCase()
            : "";

        let icon = "📄";
        let description = "File";

        if (extension === "html") {
          icon = "🌐";
          description = "Web page";
        }

        if (extension === "css") {
          icon = "🎨";
          description = "Stylesheet";
        }

        if (extension === "js") {
          icon = "⚡";
          description = "JavaScript";
        }

        if (extension === "json") {
          icon = "📦";
          description = "JSON";
        }

        if (
          ["png", "jpg", "jpeg", "gif", "webp", "svg"]
            .includes(extension)
        ) {
          icon = "🖼️";
          description = "Image";
        }

        if (
          ["zip", "rar", "7z"]
            .includes(extension)
        ) {
          icon = "📦";
          description = "Archive";
        }

        const left = document.createElement("div");
        left.className = "file-left";

        const iconElement = document.createElement("div");
        iconElement.className = "icon";
        iconElement.textContent = icon;

        const info = document.createElement("div");

        const filename = document.createElement("span");
        filename.className = "filename";
        filename.textContent = file.path;

        const desc = document.createElement("span");
        desc.className = "description";
        desc.textContent = description;

        info.appendChild(filename);
        info.appendChild(desc);

        left.appendChild(iconElement);
        left.appendChild(info);

        const arrow = document.createElement("div");
        arrow.className = "arrow";
        arrow.textContent = "→";

        link.appendChild(left);
        link.appendChild(arrow);

        filesContainer.appendChild(link);
      });

    } catch (error) {

      console.error(error);

      countElement.textContent = "";

      filesContainer.innerHTML = `
        <div class="status error">
          Unable to load repository files.
          <br><br>
          ${escapeHTML(error.message)}
        </div>
      `;
    }
  }

  function escapeHTML(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  loadDirectory();

  /*
   * Refresh the directory every 60 seconds.
   * This means newly-added files appear automatically
   * without manually editing index.html.
   */

  setInterval(loadDirectory, 60000);
</script>

</body>
</html>
