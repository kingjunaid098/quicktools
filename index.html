<body>

<div class="top"></div>

<div class="container">

  <div class="header">
    <div class="logo">⚙</div>
    <h1>quicktools</h1>
    <span class="badge">Directory</span>
  </div>

  <div class="path">
    📁 /quicktools
  </div>

  <div class="directory">

    <div class="directory-header">
      Repository files
    </div>

    <div id="files" class="status">
      Loading files...
    </div>

  </div>

  <footer>
    Automatically generated from GitHub
  </footer>

</div>

<script>
  /*
   * CHANGE THESE TWO VALUES
   */

  const GITHUB_USER = "kingjunaid098";
  const GITHUB_REPO = "growwexporter";

  /*
   * Optional: folder inside the repository.
   * Leave empty "" for the repository root.
   */

  const FOLDER = "";

  const filesContainer = document.getElementById("files");

  async function loadFiles() {
    const url =
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FOLDER}`;

    try {
      const response = await fetch(url);

      if (!response.ok) {
        throw new Error(`GitHub API returned ${response.status}`);
      }

      const files = await response.json();

      filesContainer.innerHTML = "";

      /*
       * Sort folders first, then files alphabetically.
       */

      files.sort((a, b) => {
        if (a.type === b.type) {
          return a.name.localeCompare(b.name);
        }

        return a.type === "dir" ? -1 : 1;
      });

      files.forEach(file => {

        /*
         * Ignore the directory page itself.
         */

        if (file.name === "index.html") {
          return;
        }

        const link = document.createElement("a");

        link.className = "file";

        /*
         * GitHub Pages / normal website URL.
         */

        if (file.type === "dir") {
          link.href = `./${file.name}/`;
        } else {
          link.href = `./${file.name}`;
        }

        const icon = file.type === "dir" ? "📁" : "📄";

        const description =
          file.type === "dir"
            ? "Directory"
            : "File";

        link.innerHTML = `
          <div class="file-left">
            <div class="icon">${icon}</div>

            <div>
              <span class="filename">
                ${escapeHTML(file.name)}
              </span>

              <span class="description">
                ${description}
              </span>
            </div>
          </div>

          <div class="arrow">→</div>
        `;

        filesContainer.appendChild(link);
      });

      if (!filesContainer.children.length) {
        filesContainer.innerHTML =
          '<div class="status">No files found.</div>';
      }

    } catch (error) {

      console.error(error);

      filesContainer.innerHTML = `
        <div class="status error">
          Unable to load repository files.
          <br><br>
          Make sure the repository is public.
        </div>
      `;
    }
  }

  function escapeHTML(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  loadFiles();
</script>

</body>
</html>
